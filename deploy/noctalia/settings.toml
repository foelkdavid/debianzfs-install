[nightlight]
enabled = true

[shell]
screen_time_enabled = true
telemetry_enabled = false

[theme]
builtin = "Gruvbox"
source = "builtin"

[wallpaper]
directory = "/opt/media/wall"

    [wallpaper.default]
    path = "/opt/media/wall/debianzfs_1.png"

    [wallpaper.last]
    path = "/opt/media/wall/debianzfs_1.png"

[weather]
address = "Linz, Austria"

[widget.clock]
scale = 1.3

[widget.workspaces]
capsule = true
hide_when_empty = true
